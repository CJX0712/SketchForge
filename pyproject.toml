[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sketchforge"
version = "0.1.0"
description = "Fixed-budget data-stream sketching toolkit"
license = { text = "Apache-2.0" }
authors = [{ name = "晨星" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
]

[project.optional-dependencies]
tier0 = ["datasketches==5.2.0"]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[tool.setuptools.packages.find]
include = ["sketchforge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["pilot"]  # exploratory scratch scripts, not shipped code

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # E501 handled by formatter/reflow below

[tool.ruff.format]
quote-style = "double"
